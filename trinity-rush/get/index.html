<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Trinity Rush</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c1018">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-64.png" type="image/png">
  <link rel="stylesheet" href="/css/site.css">
  <script>
    (function () {
      var ios = "https://apps.apple.com/id/app/trinity-rush/id6808545737";
      var android = "https://play.google.com/store/apps/details?id=com.wono.trinity_rush";
      var desktop = "/trinity-rush/";
      var ua = navigator.userAgent || "";
      var touchMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      var target = desktop;

      if (/Android/i.test(ua)) {
        target = android;
      } else if (/iPhone|iPad|iPod/i.test(ua) || touchMac) {
        target = ios;
      }

      window.location.replace(target);
    })();
  </script>
</head>
<body class="theme-trinity">
  <main>
    <section class="hero">
      <div class="narrow">
        <p class="eyebrow">Trinity Rush</p>
        <h1>Opening the store…</h1>
        <p class="lede">If nothing happens, pick your store.</p>
        <div class="actions">
          <a class="btn btn-primary" href="https://apps.apple.com/id/app/trinity-rush/id6808545737">App Store</a>
          <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.wono.trinity_rush">Google Play</a>
          <a class="btn" href="/trinity-rush/">Trinity Rush page</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
