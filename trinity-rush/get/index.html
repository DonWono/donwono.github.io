  <script>
    (function () {
      var ios = "https://apps.apple.com/id/app/trinity-rush/id6808545737";
      var android = "https://play.google.com/store/apps/details?id=com.wono.trinity_rush";
      var desktop = "/trinity-rush/";
      var ua = navigator.userAgent || "";
      var touchMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      var target = desktop;

      if (/Android/i.test(ua)) {
        target = android;
      } else if (/iPhone|iPad|iPod/i.test(ua) || touchMac) {
        target = ios;
      }

      window.location.replace(target);
    })();
  </script>
